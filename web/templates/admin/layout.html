<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} - Панель администратора Lares</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="header">
    <div class="brand">Lares</div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/" class="btn btn-secondary">На главную</a>
      <a href="/admin/logout" class="btn btn-danger">Выйти</a>
    </div>
  </header>
  <div class="admin-layout">
    <aside class="sidebar">
      <h1 class="serif">Lares</h1>
      <nav>
        <a href="/admin" class="{{ if eq .Section "dashboard" }}active{{ end }}"><span>▣</span> Дашборд</a>
        <a href="/admin/people" class="{{ if eq .Section "people" }}active{{ end }}"><span>☻</span> Пользователи</a>
        <a href="/admin/invites" class="{{ if eq .Section "invites" }}active{{ end }}"><span>✉</span> Инвайты</a>
        <a href="/admin/sessions" class="{{ if eq .Section "sessions" }}active{{ end }}"><span>◫</span> Сессии</a>
        <a href="/admin/files" class="{{ if eq .Section "files" }}active{{ end }}"><span>📁</span> Все файлы</a>
        <a href="/admin/uploads" class="{{ if eq .Section "uploads" }}active{{ end }}"><span>⬆</span> Активные загрузки</a>
        <a href="/admin/quarantine" class="{{ if eq .Section "quarantine" }}active{{ end }}"><span>⚠</span> Карантин {{ if .QuarantineCount }}<span class="badge badge-warning" style="margin-left: auto;">{{ .QuarantineCount }}</span>{{ end }}</a>
        <a href="/admin/traffic" class="{{ if eq .Section "traffic" }}active{{ end }}"><span>⇄</span> Трафик</a>
        <a href="/admin/audit" class="{{ if eq .Section "audit" }}active{{ end }}"><span>📜</span> Аудит лог</a>
        <a href="/admin/settings" class="{{ if eq .Section "settings" }}active{{ end }}"><span>⚙</span> Настройки</a>
      </nav>
      <div style="margin-top: auto; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; opacity: 0.7;">
        Администратор<br>Lares System
      </div>
    </aside>
    <main class="main-content">
      {{ template "admin_content" . }}
    </main>
  </div>
</body>
</html>
