{{ define "content" }}
<div style="max-width: 400px; margin: 60px auto;" class="card">
  <h2 style="text-align: center; margin-bottom: 24px;">Вход для администратора</h2>
  {{ if .Error }}
    <div style="background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 6px; margin-bottom: 16px;">
      {{ .Error }}
    </div>
  {{ end }}
  <form method="POST" action="/admin/login">
    <div class="form-group">
      <label for="username">Имя пользователя:</label>
      <input type="text" id="username" name="username" class="form-control" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Пароль:</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="totp">Код TOTP (6 цифр из приложения):</label>
      <input type="text" id="totp" name="totp" class="form-control" placeholder="123456" required autocomplete="off">
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Войти</button>
  </form>
</div>
{{ end }}
