{{define "content"}}
<div style="max-width: 420px; margin: 4rem auto;">
  <div class="card">
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Активация доступa</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Введите 16-значный инвайт-код, предоставленный администратором</p>

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="form-group">
        <label for="invite_code">Инвайт-код</label>
        <input type="text" id="invite_code" name="invite_code" class="form-control" placeholder="XXXX-XXXX-XXXX-XXXX" required autofocus autocomplete="off">
      </div>
      <div class="form-group">
        <label for="device_name">Имя устройства (опционально)</label>
        <input type="text" id="device_name" name="device_name" class="form-control" placeholder="Например: Мой ПК / Телефон">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Войти в система</button>
    </form>
  </div>
</div>
{{end}}
