{{define "content"}}
<div style="max-width: 420px; margin: 4rem auto;">
  <div class="card">
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Вход для администратора</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Введите данные администратора и TOTP-код</p>

    <form method="POST" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" class="form-control" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="totp_code">Код двухфакторной аутентификации (TOTP 6 цифр)</label>
        <input type="text" id="totp_code" name="totp_code" class="form-control" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Войти в админ-панель</button>
    </form>
  </div>
</div>
{{end}}
