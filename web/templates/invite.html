{{ define "content" }}
<div style="max-width: 450px; margin: 60px auto;" class="card">
  <h2 style="text-align: center; margin-bottom: 8px;">Активация доступа к Lares</h2>
  <p style="text-align: center; color: var(--text-secondary); margin-bottom: 24px;">Введите ваш 16-значный инвайт-код для входа</p>
  {{ if .Error }}
    <div style="background: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 6px; margin-bottom: 16px;">
      {{ .Error }}
    </div>
  {{ end }}
  <form method="POST" action="/invite">
    <div class="form-group">
      <label for="code">Инвайт-код (XXXX-XXXX-XXXX-XXXX):</label>
      <input type="text" id="code" name="code" class="form-control" placeholder="XXXX-XXXX-XXXX-XXXX" required autofocus style="text-transform: uppercase; font-family: monospace; letter-spacing: 2px; text-align: center; font-size: 1.1rem;">
    </div>
    <div class="form-group">
      <label for="device_name">Имя вашего устройства:</label>
      <input type="text" id="device_name" name="device_name" class="form-control" placeholder="Например: Ноутбук Chrome" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">Активировать доступ</button>
  </form>
</div>
{{ end }}
